version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: pulsecare-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pulsecare-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - FLASK_DEBUG=0
      - PORT=5000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
